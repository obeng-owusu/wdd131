<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Album | WDD131</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap"

    <!-- CSS -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <!-- JavaScript -->

<body>

    <header>
        <div class="header-container">
            <div class="logo">Temple Album</div>

            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Navigation Menu" aria-expanded="false">

        </div>

        <nav id="navMenu">
            <ul>
                <li><a href="#" class="active">Home</a></li>

                <li><a href="#">New</a></li>

        </nav>
    </header>

    <main>
        <h1>Temple Album</h1>

        <section class="gallery">

            <figure>
                <img src="images/salt-lake-temple.webp" alt="Salt Lake Temple" loading="lazy">

            </figure>

            <figure>
                <img src="images/washington-temple.webp" alt="Washington DC Temple" loading="lazy">
                <figcaption>Washington DC Temple</figcaption>

            <figure>

            </figure>

            <figure>
                <img src="images/london-england-temple.webp" alt="London England Temple" loading="lazy">
                <figcaption>London England Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rome-italy-temple.webp" alt="Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>

    <footer>
