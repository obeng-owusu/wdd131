<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Required Meta Tags -->
    <meta name="description"
        content="Review confirmation page. Your product review has been successfully submitted. Thank you for your feedback.">

    <meta name="author" content="Joshua Obeng">

    <title>Review Confirmation</title>

    <link rel="stylesheet" href="styles/form.css">
</head>

<body>

    <header>
        <h1>Review Submitted</h1>
    </header>

    <main class="review-container">

        <div class="confirmation-box">

            <h2>Thank You!</h2>

            <p>Your review has been submitted successfully.</p>

            <p>
                Number of reviews completed:
                <strong id="review-counter"></strong>
            </p>

            <a href="form.html" class="submit-btn return-btn">
                Submit Another Review
            </a>

        </div>

    </main>

    <footer class="common-footer">
        <p>© 2026 Product Review System | Joshua Obeng</p>
        <p>Your feedback helps us improve</p>
    </footer>

    <script src="scripts/form.js" defer></script>

</body>

</html>
