<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Required Meta Tags -->
    <meta name="description"
        content="Submit product reviews and ratings. Share your experience, evaluate features, and help others make informed decisions.">

    <meta name="author" content="Joshua Obeng">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main class="review-container">

        <form method="get" action="review.html" class="review-form">

            <!-- Product Name -->
            <label for="product-name">
                Product Name <span class="required">*</span>
            </label>

            <select id="product-name" name="productName" required>
                <option value="" selected disabled>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <label>
                Overall Rating <span class="required">*</span>
            </label>

            <div class="rating-group">
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">★</label>

                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating2">★★</label>

                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating3">★★★</label>

                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating4">★★★★</label>

                <input type="radio" id="rating5" name="rating" value="5" required>
                <label for="rating5">★★★★★</label>
            </div>

            <!-- Date of Installation -->
            <label for="install-date">
                Date of Installation <span class="required">*</span>
            </label>

            <input type="date" id="install-date" name="installDate" required>

            <!-- Useful Features -->
            <label>
                Which features did you find useful in the product?
                <em>(Check all that apply)</em>
            </label>

            <div class="checkbox-group">
                <input type="checkbox" id="durability" name="features" value="Durability">
                <label for="durability">Durability</label>

                <input type="checkbox" id="easeofuse" name="features" value="Ease of Use">
                <label for="easeofuse">Ease of Use</label>

                <input type="checkbox" id="performance" name="features" value="Performance">
                <label for="performance">Performance</label>

                <input type="checkbox" id="design" name="features" value="Design">
                <label for="design">Design</label>
            </div>

            <!-- Written Review -->
            <label for="written-review">
                Written Review
                <span class="optional">(Optional)</span>
            </label>

            <textarea id="written-review" name="writtenReview"></textarea>

            <!-- User Name -->
            <label for="username">
                Your Name
                <span class="optional">(Optional)</span>
            </label>

            <input type="text" id="username" name="username">

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">
                Post Review
            </button>

        </form>
    </main>

    <footer class="common-footer">
        <p>© 2026 Product Review System | Joshua Obeng</p>
        <p>Your feedback helps us improve </p>
    </footer>

    <script src="scripts/form.js" defer></script>

</body>

</html>
